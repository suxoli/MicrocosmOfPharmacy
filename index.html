<!DOCTYPE html>
<html>
<head>
    <!-- 头部内容保持不变 -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>YYSMART | MicrocosmOfPharmacy</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- 样式部分保持不变 -->
    <style>
        /* 原有样式代码不变 */
    </style>
</head>
<body>
    <!-- DOM结构部分保持不变 -->
    <!-- 摄像头视频容器（隐藏） -->
    <video id="webcam-video" muted autoplay playsinline></video>
    <canvas id="video-canvas"></canvas>
    <!-- 其他弹窗和Unity容器代码不变 -->
    <!-- 脚本引入 -->
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="htracker.js" type="text/javascript"></script>
    <script src="Build/MicrocosmOfPharmacy.loader.js"></script>

    <script>
        // 全局变量定义（统一前置）
        let unityInstance = null;
        const isMobileBrowser = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        // 新增：标记Unity是否完全就绪
        let isUnityReady = false;

        // ========== 初始化加载栏样式 ==========
        function initLoadingBar() {
            // 原有代码不变
            const loadingBar = document.getElementById('unity-loading-bar');
            const loadingLogo = document.getElementById('unity-logo');

            if (isMobileBrowser) {
                loadingBar.classList.add('loading-bar--mobile');
                if (!document.querySelector('meta[name="viewport"][content*="user-scalable=no"]')) {
                    const meta = document.createElement('meta');
                    meta.name = 'viewport';
                    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no';
                    document.head.appendChild(meta);
                }
                console.log("📱 移动端：进度条为竖版，Logo已正位");
            } else {
                loadingBar.classList.remove('loading-bar--mobile');
                console.log("💻 PC端：进度条为横版，Logo已正位");
            }
        }

        // ========== Unity加载完成回调 ==========
        function unityLoaded() {
            document.getElementById('loading-cover').style.display = 'none';
            // 新增：标记Unity完全就绪
            isUnityReady = true;
            console.log("✅ Unity已完全加载就绪");
        }

        // ========== 手部追踪器初始化 ==========
        async function initializeTracker() {
            // 原有代码不变
            const unityCanvas = document.querySelector("#unity-canvas");
            const videoCanvas = document.querySelector("#video-canvas");

            window.arCamera = new ARCamera(unityCanvas, videoCanvas);
            window.hTracker = new HandTracker(arCamera);

            try {
                const numHands = 1;
                await window.hTracker.initialize(
                    "./opencv.js",
                    "./mediapipe/tasks-vision@0.10.6.js",
                    "./mediapipe/wasm",
                    "./mediapipe/hand_landmarker.task",
                    numHands,
                    0.3, // 检测置信度
                    0.3, // 存在置信度
                    0.3  // 跟踪置信度
                );
                console.log("✅ 手部追踪器初始化完成！");
            } catch (error) {
                console.error("❌ 手部追踪器初始化失败：", error);
                ShowError("体验初始化失败，请检查依赖文件是否完整。");
                return;
            }

            await LoadWebcams();
            document.getElementById("startARButton").style.display = "block";
        }

        // ========== AR启动核心逻辑（清理重复代码） ==========
        async function StartAR() {
            document.getElementById("startARDiv").style.display = "none";

            try {
                unityInstance = await createUnityInstance(document.querySelector("#unity-canvas"), {
                    dataUrl: `Build/MicrocosmOfPharmacy.data.unityweb`,
                    frameworkUrl: `Build/MicrocosmOfPharmacy.framework.js.unityweb`,
                        codeUrl: `Build/MicrocosmOfPharmacy.wasm.unityweb`,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "NanJingYaoYu",
                    productName: "MicrocosmOfPharmacy",
                    productVersion: "0.1"
                }, (progress) => {
                    const progressFill = document.getElementById('unity-progress-bar-full');
                    if (isMobileBrowser) {
                        progressFill.style.height = `${100 * progress}%`;
                    } else {
                        progressFill.style.width = `${100 * progress}%`;
                    }
                });

                // 修改1：Unity实例创建后，先标记就绪，再延迟调用摄像头请求（给Unity场景加载时间）
                unityLoaded(); // 先隐藏加载遮罩，标记Unity就绪
                // 延迟500ms请求摄像头，确保Unity场景内的ARCamera对象加载完成
                setTimeout(async () => {
                    await RequestWebcam();
                    console.log("✅ Unity实例创建成功，AR体验启动");
                }, 500);

            } catch (error) {
                console.error("❌ Unity实例创建失败：", error);
                ShowError("AR体验启动失败，请刷新页面重试。");
            }
        }

        // ========== 摄像头相关逻辑 ==========
		window.unityFacingMode = "user"
        window.WEBCAM_SETTINGS = {
            video: { facingMode: window.unityFacingMode },
            audio: false
        };
        window.requestingForPermissions = false;

        // ========== 请求摄像头权限（核心修改） ==========
        async function RequestWebcam() {
            window.requestingForPermissions = true;
            try {
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                console.log("✅ 摄像头权限已授权");

                // 修改2：调用setFlipped前增加双重判空保护
                if (isUnityReady && window.arCamera && typeof window.arCamera.setFlipped === 'function') {
                    // 封装setFlipped调用，增加异常捕获
                    try {
                        arCamera.setFlipped(window.WEBCAM_SETTINGS.video.facingMode === 'user');
                    } catch (setFlippedError) {
                        console.warn("⚠️ setFlipped调用暂时失败（Unity对象未就绪）：", setFlippedError);
                        // 降级方案：延迟重试一次
                        setTimeout(() => {
                            if (isUnityReady) {
                                arCamera.setFlipped(window.WEBCAM_SETTINGS.video.facingMode === 'user');
                            }
                        }, 300);
                    }
                }

                await StartWebcam(); // 权限成功后启动摄像头
            } catch (err) {
                console.error("❌ 获取摄像头权限失败：", err);
                ShowError("体验启动失败，摄像头权限被拒绝。");
            } finally {
                window.requestingForPermissions = false;
            }
        }

        // ========== 启动摄像头流（增加判空） ==========
        async function StartWebcam() {
            if (!window.webcamStream) return;
            // 修改3：调用SendMessage前检查unityInstance是否存在
            if (!unityInstance) {
                console.warn("⚠️ Unity实例未就绪，暂不通知摄像头启动状态");
                return;
            }

            const video = document.querySelector("#webcam-video");
            video.srcObject = window.webcamStream;

            try {
                await arCamera.startWebcam(video);
                unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
                console.log("✅ 摄像头启动成功");
            } catch (err) {
                console.error("❌ 摄像头启动失败：", err);
                unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
            }
        }

        // 其他函数（LoadWebcams、SelectCam、FlipCam、ShowError等）保持不变
        async function LoadWebcams() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camDevices = devices.filter(device => device.kind === 'videoinput');
                const select = document.getElementById("chooseCamSel");

                if (camDevices.length === 0) {
                    ShowError("未检测到可用摄像头设备。");
                    return;
                }

                select.style.display = "block";
                camDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.textContent = device.label || `摄像头 ${index + 1}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("❌ 加载摄像头列表失败：", error);
            }
        }

        function SelectCam() {
            const select = document.getElementById("chooseCamSel");
            window.WEBCAM_SETTINGS.video.deviceId = select.value;
        }

        async function FlipCam() {
            try {
                arCamera.stopWebcam();
                window.WEBCAM_SETTINGS.video.deviceId = '';

                if (window.WEBCAM_SETTINGS.video.facingMode === 'user') {
                    window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                    arCamera.setFlipped(false);
                } else {
                    window.WEBCAM_SETTINGS.video.facingMode = 'user';
                    arCamera.setFlipped(true);
                }

                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                const video = document.querySelector("#webcam-video");
                video.srcObject = window.webcamStream;
                await arCamera.startWebcam(video);
                console.log("✅ 摄像头已翻转");
            } catch (error) {
                console.error("❌ 翻转摄像头失败：", error);
                ShowError("切换摄像头失败，请重试。");
            }
        }

        function ShowError(error) {
            const errorDiv = document.getElementById("errorDiv");
            const errorText = document.getElementById("errorText");
            errorText.textContent = error;
            errorDiv.style.display = "flex";
        }

        function ShowScreenshot(dataUrl) {
            const screenshotDiv = document.getElementById("screenshotDiv");
            const screenshotImg = document.getElementById("screenshotImg");
            screenshotImg.src = dataUrl;
            screenshotDiv.style.display = "flex";
        }

        function ShowConfirmUrl(url) {
            const confirmDiv = document.getElementById("confirmUrlDiv");
            const confirmText = document.getElementById("confirmUrlText");
            window.newUrlString = url;
            confirmText.textContent = `您确定要访问 ${url} 吗？`;
            confirmDiv.style.display = "flex";
        }

        // 全局配置
        window.hTracker_GLOBALS = {};

        // ========== 初始化执行 ==========
        initLoadingBar();
        initializeTracker();
    </script>
</body>
</html>
