<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content='width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes'>
    <title>YYSMART | MicrocosmOfPharmacy</title>
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html {
            height: -webkit-fill-available;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden;
        }

        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #fffa;
            z-index: 99;
        }
        /* ========== Unity 加载相关 UI 样式 ========== */
        #unity-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* 补全缺失的loading-cover容器样式 */
        #loading-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        /* 加载栏容器 */
        #unity-loading-bar {
            width: 60%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.95);
            padding: 30px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        #unity-logo {
            width: 90px;
            height: 90px;
            background: url('TemplateData/unity-logo-light.png') center/contain no-repeat;
            margin-bottom: 20px;
            transform: scaleX(-1);
        }

        /* ========== PC端横版进度条（默认） ========== */
        #unity-progress-bar-empty {
            width: 100%;
            height: 7px;
            border: 1px solid #eee;
            border-radius: 7px;
            overflow: hidden;
            background-color: #f8f8f8;
            position: relative;
        }

        #unity-progress-bar-full {
            height: 100%;
            background-color: #ff7f24;
            width: 0%;
            transition: width 0.2s ease;
            position: absolute;
            left: 0;
            top: 0;
        }

        /* ========== 移动端竖版进度条（修复样式错乱） ========== */
        #unity-loading-bar.mobile-progress {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 85%;
            max-width: none;
            height: auto;
            padding: 20px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #unity-logo.mobile-progress {
            width: 60px;
            height: 60px;
            background: url('TemplateData/unity-logo-light.png') center/contain no-repeat;
            transform: none;
            margin: 0;
        }

        #unity-loading-bar.mobile-progress #unity-progress-bar-empty {
            width: 20px;
            height: 200px;
            border-radius: 6px;
            background-color: #f0f0f0;
            transform: rotate(180deg);
            position: relative;
        }

        #unity-loading-bar.mobile-progress #unity-progress-bar-full {
            width: 100%;
            height: 0%;
            background-color: #ff7f24;
            border-radius: 6px;
            position: absolute;
            left: 0;
            bottom: 0;
            transition: height 0.2s ease;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: block;
        }

        #unity-warning {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: red;
            color: white;
            padding: 10px;
            display: none;
            z-index: 999;
        }
        /* ========== Unity 加载样式结束 ========== */
    </style>
</head>
<body>
    <video id="webcam-video" muted autoplay playsinline style="width:1px;position:absolute"></video>
    <canvas id="video-canvas" style="width:100%; height:100%; object-fit:cover; position:absolute; z-index: -99; "></canvas>
    <div id="startARDiv" class="ctaDiv">
        <select id="chooseCamSel" style="display: none;" onchange="SelectCam()"></select>
        <p style="text-align: center; width:60vw;">此增强现实体验需要访问您设备的摄像头</p>
        <button id="startARButton" onclick="StartAR()" style="display:none">允许访问</button>
    </div>
    <div id="screenshotDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25);">
            <img id="screenshotImg" src="" alt="截图" style="width:80vw; height:80vh">
            <button onclick="document.getElementById('screenshotDiv').style.display = 'none';" style="position:absolute; transform:translateY(-100%); right:0; top:0">关闭</button>
        </div>
    </div>
    <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25); width: 80vw; display:flex; flex-direction: column; align-items: center;">
            <p id="confirmUrlText" style="text-align: center; width:80%; overflow: hidden; text-overflow: ellipsis;">您确定要访问 url.com 吗？</p>
            <div>
                <button onclick="window.open(newUrlString, '_blank').focus(); document.getElementById('confirmUrlDiv').style.display = 'none'">访问网站</button>
                <button onclick="document.getElementById('confirmUrlDiv').style.display = 'none'">返回</button>
            </div>
        </div>
    </div>
    <div id="errorDiv" class="ctaDiv" style="display: none; background:#aaa">
        <p id="errorText" style="text-align: center; width:60vw; color:white"></p>
    </div>
    <!-- 补全loading-cover容器 -->
    <div id="loading-cover">
        <div id="unity-container" class="unity-mobile">
            <canvas id="unity-canvas" style="width: 100%; height: 100%; background: #0000; z-index: -98"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <canvas id="video-canvas"></canvas>
        </div>
    </div>

    <script src="arcamera.js" type="text/javascript"></script>
    <script src="htracker.js" type="text/javascript"></script>
    <script src="Build/MicrocosmOfPharmacy.loader.js"></script>
    <script>
        // 1. 定义缺失的核心变量
        const isMobileBrowser = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const loadingLogo = document.querySelector("#unity-logo");
        const loaderUrl = "Build/MicrocosmOfPharmacy.loader.js";
        let unityInstance = null; // 统一管理Unity实例

        // 2. Unity配置（提取原有重复的配置项）
        const unityConfig = {
            dataUrl: "Build/MicrocosmOfPharmacy.data.unityweb",
            frameworkUrl: "Build/MicrocosmOfPharmacy.framework.js.unityweb",
                codeUrl: "Build/MicrocosmOfPharmacy.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "NanJingYaoYu",
            productName: "MicrocosmOfPharmacy",
            productVersion: "0.1"
        };

        // 3. 初始化加载栏样式（修复loadingLogo未定义问题）
        function initLoadingBar() {
            if (isMobileBrowser) {
                loadingBar.classList.add("mobile-progress");
                loadingLogo.classList.add("mobile-progress");
                console.log("📱 移动端：进度条为竖版，Logo已正位");
            } else {
                loadingBar.classList.remove("mobile-progress");
                loadingLogo.classList.remove("mobile-progress");
                console.log("💻 PC端：进度条为横版，Logo已正位");
            }
        }

        // 4. Unity加载完成回调
        function unityLoaded() {
            document.querySelector("#loading-cover").style.display = "none";
        }

        // 5. 初始化手部追踪器
        var initialize = async() => {
            var unityCanvas = document.querySelector("#unity-canvas");
            var videoCanvas = document.querySelector("#video-canvas");
            window.arCamera = new ARCamera(unityCanvas, videoCanvas);
            window.hTracker = new HandTracker(arCamera);
            try {
                var numHands = 2; // 设置最大检测手数

                // 本地初始化
                await window.hTracker.initialize(
                    "./opencv.js",
                    "./mediapipe/tasks-vision@0.10.6.js",
                    "./mediapipe/wasm",
                    "./mediapipe/hand_landmarker.task",
                    numHands,
                    0.3, // 检测置信度
                    0.3, // 存在置信度
                    0.3  // 跟踪置信度
                );
                console.log("✅ 手部追踪器初始化完成！");
            } catch (error) {
                console.error("❌ 手部追踪器初始化失败：", error);
                ShowError("体验初始化失败，请检查opencv.js等文件是否存在。");
                return;
            }

            await LoadWebcams();
            document.getElementById("startARButton").style.display = "block";
        };

        // 6. 启动AR核心逻辑（移除重复的Unity实例创建）
        function StartAR() {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
            document.getElementById("startARDiv").style.display = "none";

            // 统一创建Unity实例
            createUnityInstance(document.querySelector("#unity-canvas"), unityConfig, (progress) => {
                if (isMobileBrowser) {
                    // 移动端竖条：高度从0→100%（从下往上填充）
                    progressBarFull.style.height = 100 * progress + "%";
                } else {
                    // PC端横条：宽度从0→100%（从左往右填充）
                    progressBarFull.style.width = 100 * progress + "%";
                }
            }).then((instance) => {
                unityInstance = instance;
                RequestWebcam(); // 获取摄像头权限
                loadingBar.style.display = "none";
                unityLoaded(); // 隐藏加载封面
            }).catch((message) => {
                console.error("❌ Unity实例创建失败:", message);
                ShowError("Unity加载失败：" + message);
            });

            loadingBar.style.display = "block";
        }

        // 7. 摄像头相关逻辑（原有逻辑保留，仅优化报错提示）
		window.unityFacingMode = "user"
        window.WEBCAM_SETTINGS = {
            video: { facingMode: window.unityFacingMode },
            audio: false
        };
        window.requestingForPermissions = false;

        async function RequestWebcam() {
            window.requestingForPermissions = true;
            try {
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                arCamera.setFlipped(window.WEBCAM_SETTINGS.video.facingMode === 'user');
                console.log("✅ 摄像头访问已授权");
                requestingForPermissions = false;
                StartWebcam(); // 授权成功后启动摄像头
            } catch (err) {
                console.error("❌ 获取摄像头权限失败：", err);
                ShowError("体验启动失败：摄像头权限被拒绝或设备无摄像头。");
                window.requestingForPermissions = false;
            }
        }

        async function StartWebcam() {
            console.log("📹 启动摄像头");
            while (window.requestingForPermissions) {
                await new Promise(resolve => setTimeout(resolve, 100)); // 等待权限请求完成
            }

            if (window.webcamStream) {
                const video = document.querySelector("#webcam-video");
                video.srcObject = window.webcamStream;
                try {
                    await arCamera.startWebcam(video);
                    console.log("✅ 摄像头启动成功");
                    unityInstance?.SendMessage('ARCamera', 'OnStartWebcamSuccess');
                } catch (err) {
                    console.error("❌ 摄像头启动失败：", err);
                    unityInstance?.SendMessage('ARCamera', 'OnStartWebcamFail');
                    ShowError("摄像头启动失败：" + err.message);
                }
            } else {
                console.error("❌ 摄像头启动失败：权限未授权");
                unityInstance?.SendMessage('ARCamera', 'OnStartWebcamFail');
                ShowError("摄像头启动失败：未获取到摄像头权限");
            }
        }

        // 8. 摄像头选择/切换逻辑（原有逻辑保留）
        async function LoadWebcams() {
            let camDevices = [];
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                devices.forEach(mediaDevice => {
                    if (mediaDevice.kind === 'videoinput') {
                        // 过滤摄像头（根据facingMode）
                        if (window.unityFacingMode === 'environment' && !mediaDevice.label.includes('facing front')) {
                            camDevices.push(mediaDevice);
                        } else if (window.unityFacingMode === 'user' && mediaDevice.label.includes('facing front')) {
                            camDevices.push(mediaDevice);
                        } else {
                            camDevices.push(mediaDevice);
                        }
                    }
                });

                const select = document.getElementById("chooseCamSel");
                select.style.display = "block";
                let count = 0;
                camDevices.forEach(mediaDevice => {
                    const option = document.createElement('option');
                    option.value = mediaDevice.deviceId;
                    const label = mediaDevice.label || `摄像头 ${count}`;
                    option.textContent = label;
                    select.appendChild(option);
                    count++;
                });
            } catch (err) {
                console.error("❌ 枚举摄像头失败：", err);
                ShowError("无法检测到摄像头设备");
            }
        }

        function SelectCam() {
            const select = document.getElementById("chooseCamSel");
            window.WEBCAM_SETTINGS.video.deviceId = select.value;
        }

        async function FlipCam() {
            if (!window.webcamStream) return;
            arCamera.stopWebcam();
            window.WEBCAM_SETTINGS.video.deviceId = '';

            if (window.WEBCAM_SETTINGS.video.facingMode === 'user') {
                window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                arCamera.setFlipped(false);
            } else {
                window.WEBCAM_SETTINGS.video.facingMode = 'user';
                arCamera.setFlipped(true);
            }

            try {
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                const video = document.querySelector("#webcam-video");
                video.srcObject = window.webcamStream;
                await arCamera.startWebcam(video);
            } catch (err) {
                console.error("❌ 切换摄像头失败：", err);
                ShowError("切换摄像头失败，请重新授权");
            }
        }

        // 9. 通用提示逻辑（原有逻辑保留）
        function ShowError(error) {
            document.getElementById("errorDiv").style.display = "flex";
            document.getElementById("errorText").innerHTML = error;
        }

        function ShowScreenshot(dataUrl) {
            document.getElementById("screenshotDiv").style.display = "flex";
            document.getElementById("screenshotImg").src = dataUrl;
            document.getElementById("screenshotImg").style.width = "80vw";
            document.getElementById("screenshotImg").style.height = 80 / window.innerWidth * window.innerHeight + "vw";
        }

        function ShowConfirmUrl(url) {
            document.getElementById("confirmUrlDiv").style.display = "flex";
            window.newUrlString = url;
            document.getElementById("confirmUrlText").innerText = "您确定要访问 " + url;
        }

        // 10. 全局变量
        window.hTracker_GLOBALS = {};

        // 11. 初始化执行
        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingBar = document.querySelector("#unity-loading-bar");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        // 适配移动端视口
        if (isMobileBrowser) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no';
            document.head.appendChild(meta);
        }

        // 先初始化加载栏样式
        initLoadingBar();
        // 初始化手部追踪器
        initialize();
    </script>
</body>
</html>
